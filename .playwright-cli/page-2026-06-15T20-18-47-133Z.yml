          - 'heading "Moto électrique vs moto thermique : quel équivalent ?" [level=2] [ref=e239]'
          - paragraph [ref=e240]:
            - text: Sur les usages
            - strong [ref=e241]: urbains de moins de 50 km par jour
            - text: ", la moto électrique gagne face à la moto thermique : silence, pas d’embrayage, pas de boîte, recharge nocturne, accès ZFE garanti, coût d’usage 4 fois inférieur. Inconvénient mineur : poids supérieur de 15-25 kg vs équivalent thermique."
          - paragraph [ref=e242]:
            - text: Sur les
            - strong [ref=e243]: trajets routiers de plus de 200 km
            - text: ", la moto thermique conserve l’avantage : pas de planification de charge, autonomie 350-450 km par plein, ravitaillement en 3 minutes. C’est le terrain de jeu typique d’un roadster comme la"
            - link "Yamaha MT-07 ou MT-09" [ref=e244] [cursor=pointer]:
              - /url: /blog/yamaha-mt07-vs-mt09/
            - text: .
          - paragraph [ref=e245]:
            - text: Sur le
            - strong [ref=e246]: tout-terrain
            - text: ", l’arrivée des Sur-Ron, Talaria et Stark Varg a renversé la donne : silence, couple instantané, pas d’embrayage à gérer, écologique sur sentier. L’enduro électrique gagne du terrain face au 2 temps thermique sur les compétitions amateures."
          - heading "Budget total sur 5 ans" [level=2] [ref=e247]
          - paragraph [ref=e248]:
            - text: L’achat varie de 1 à 7 selon le segment. Le
            - strong [ref=e249]: bonus écologique
            - text: retire jusqu’à 6 000 € sur les modèles homologués route de plus de 3 kW.
          - paragraph [ref=e250]:
            - text: L’
            - strong [ref=e251]: énergie
            - text: coûte 0,8 à 1,5 € pour 100 km en charge domestique, contre 4-5 € pour une thermique équivalente. Pour 8 000 km par an, 80-120 € d’énergie contre 250-300 € de carburant.
          - paragraph [ref=e252]:
            - text: L’
            - strong [ref=e253]: entretien
            - text: "d’une moto électrique est minimal : pas de vidange ni filtres ni bougies. Plaquettes tous les 30 000 km, pneus tous les 12-18 000 km. Sur 5 ans, 600 à 1 000 € au total."
          - paragraph [ref=e254]:
            - text: La
            - strong [ref=e255]: batterie premium
            - text: (Zero, Energica, LiveWire) garantit 5 ans ou 80 % de capacité résiduelle. Remplacement 5 000 à 8 000 € hors pose au-delà. Sur Sur-Ron et Talaria, 700 à 1 200 € après 1 000-1 500 cycles.
          - paragraph [ref=e256]:
            - text: Le
            - strong [ref=e257]: break-even
            - text: moto électrique vs moto thermique se fait autour de la 4ème année pour un commuter quotidien (8 000 km+/an).
