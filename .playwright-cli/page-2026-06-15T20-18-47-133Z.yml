        - generic [ref=e97]:
          - paragraph [ref=e98]:
            - text: La
            - strong [ref=e99]: moto électrique
            - text: s’installe en 2026 comme une alternative crédible à la moto thermique sur les usages urbains et tout-terrain. Comptez
            - strong [ref=e100]: 3 500 à 30 000 €
            - text: selon l’autonomie et la puissance, des temps de charge de 1 à 8 heures, un coût d’usage divisé par 4 face à un équivalent thermique comme la
            - link "meilleure moto A2" [ref=e101] [cursor=pointer]:
              - /url: /blog/meilleure-moto-a2/
            - text: . Ce comparatif détaille
            - strong [ref=e102]: 10 modèles
            - text: homologués route et off-road, le critère autonomie réelle vs autonomie WMTC, le budget total sur 5 ans, et la réglementation A1/A2/B selon la puissance.
          - heading "Critères pour choisir une moto électrique" [level=2] [ref=e103]
          - paragraph [ref=e104]:
            - strong [ref=e105]: L’autonomie réelle
            - text: est le critère numéro un sur une moto électrique. La valeur utile est l’autonomie autoroute à 110-120 km/h, qui représente
            - strong [ref=e106]: 50 à 60 % de l’autonomie WMTC
            - text: annoncée par le constructeur. Une Zero SR/F ZF15.6 affiche 259 km WMTC et tient en pratique 130-160 km à 130 km/h.
          - paragraph [ref=e107]:
            - strong [ref=e108]: Le temps de charge
            - text: dépend du chargeur embarqué. Sur prise domestique 2,3 kW, comptez 6 à 10 h pour 0-100 %. Sur borne rapide CCS Combo (Zero Charge Tank, Energica DC), 40 minutes à 2 h selon le modèle.
          - paragraph [ref=e109]:
            - strong [ref=e110]: La puissance
            - text: "détermine le permis requis : moins de 11 kW = A1 ou B + 7h, 11-35 kW = A2, plus de 35 kW = A. Plusieurs constructeurs livrent leur moto électrique en plusieurs niveaux de puissance via mise à jour logicielle."
          - paragraph [ref=e111]:
            - strong [ref=e112]: L’usage prévu
            - text: "dicte le segment : urbain quotidien (Super Soco, Silence), polyvalent route (Zero S/SR/F, LiveWire), tout-terrain off-road (Sur-Ron, Talaria), hyper-sportif circuit (Energica Ego+)."
          - paragraph [ref=e113]:
            - strong [ref=e114]: Le bonus écologique 2026
            - text: retire jusqu’à
            - strong [ref=e115]: 6 000 €
            - text: sur les motos électriques de plus de 3 kW homologuées route, sous condition de revenu fiscal.
