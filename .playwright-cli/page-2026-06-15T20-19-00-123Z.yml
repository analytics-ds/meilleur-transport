          - heading "Comment choisir la meilleure assurance moto ?" [level=2] [ref=e388]
          - paragraph [ref=e389]: La meilleure assurance moto n’est pas la même pour tous les motards. Le bon contrat dépend de la cylindrée, de l’usage, de l’expérience du conducteur et du budget. Quatre critères font la différence.
          - 'heading "Tiers ou tous risques : quelle formule choisir ?" [level=3] [ref=e390]'
          - paragraph [ref=e391]:
            - text: La
            - strong [ref=e392]: formule au tiers
            - text: couvre la responsabilité civile, c’est le minimum légal obligatoire. La
            - strong [ref=e393]: formule intermédiaire
            - text: ajoute le vol, l’incendie et le bris de glace. La
            - strong [ref=e394]: formule tous risques
            - text: couvre aussi les dommages au deux-roues, même en cas d’accident responsable. Pour une moto récente ou de valeur, le tous risques reste le plus protecteur. Pour une machine ancienne, un tiers étendu avec vol et incendie suffit souvent.
          - heading "Les garanties complémentaires qui comptent" [level=3] [ref=e395]
          - paragraph [ref=e396]:
            - strong [ref=e397]: Garantie équipement
            - text: ", assistance dès 0 km, prêt de guidon, protection juridique et surtout"
            - strong [ref=e398]: garantie du conducteur
            - text: changent l’expérience réelle après un sinistre. La garantie du conducteur, qui couvre les propres blessures du pilote, reste le poste le plus souvent négligé alors qu’il est essentiel à moto. Le niveau de protection se règle aussi selon le véhicule, comme le détaille le comparatif de la
            - link "meilleure moto A2" [ref=e399] [cursor=pointer]:
