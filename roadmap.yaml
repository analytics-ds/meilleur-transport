  - kw: "meilleur velo electrique 2026"
    category: "Particuliers"
    volume: null
    kd: null
    scheduled_date: "2026-04-28"
    status: done
    published_date: "2026-04-28"
    published_url_fr: "https://meilleur-transport.com/blog/meilleur-velo-electrique-2026/"
    published_url_en: "https://meilleur-transport.com/en/blog/best-electric-bike-2026/"
